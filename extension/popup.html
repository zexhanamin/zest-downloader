<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zest Downloader</title>
  <style>
    /* ── Tokens ── */
    :root {
      --accent:      #5B5EF4;
      --accent-dim:  #4446c7;
      --accent-glow: rgba(91,94,244,0.15);
      --bg:          #111114;
      --bg-panel:    #18181C;
      --bg-card:     #1E1E24;
      --bg-hover:    #26262E;
      --border:      #2A2A34;
      --border-sub:  #222228;
      --text:        #EDEDF0;
      --text-sec:    #8888A0;
      --text-muted:  #55556A;
      --green:       #5BCC7A;
      --red:         #F46B6B;
      --yellow:      #E8A030;
      --radius:      8px;
      --font:        'Inter', system-ui, sans-serif;
      --mono:        'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: var(--font);
      font-size: 12.5px;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border-sub);
    }

    .logo {
      width: 26px;
      height: 26px;
      background: var(--accent);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      flex-shrink: 0;
    }

    .header-title {
      flex: 1;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }

    .header-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Enable toggle */
    .toggle {
      position: relative;
      width: 34px;
      height: 19px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .toggle input:checked + .toggle-track { background: var(--accent); }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 2.5px; left: 2.5px;
      width: 14px; height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 150ms ease;
    }

    .toggle input:checked + .toggle-track::after {
      transform: translateX(15px);
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-sub);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .status-dot.off    { background: var(--text-muted); }
    .status-dot.error  { background: var(--red); }

    .status-text {
      font-size: 11px;
      color: var(--text-sec);
      flex: 1;
    }

    .capture-count {
      font-size: 10.5px;
      font-family: var(--mono);
      color: var(--text-muted);
    }

    /* ── Add URL section ── */
    .section { padding: 10px 14px; border-bottom: 1px solid var(--border-sub); }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    .url-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 10px;
      font-family: var(--font);
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
      min-width: 0;
    }

    .url-input::placeholder { color: var(--text-muted); }

    .url-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 500;
      font-size: 11.5px;
      border-radius: var(--radius);
      padding: 0 12px;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 150ms, opacity 150ms;
      white-space: nowrap;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dim); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-ghost {
      background: var(--bg-hover);
      color: var(--text-sec);
    }

    .btn-ghost:hover { color: var(--text); }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      padding: 8px 14px 0;
      gap: 2px;
      border-bottom: 1px solid var(--border-sub);
    }

    .tab {
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 5px 10px 7px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 150ms, border-color 150ms;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab:hover:not(.active) { color: var(--text-sec); }

    /* ── History list ── */
    .history-wrap {
      max-height: 220px;
      overflow-y: auto;
    }

    .history-wrap::-webkit-scrollbar { width: 4px; }
    .history-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-sub);
      transition: background 120ms;
    }

    .history-item:last-child { border-bottom: none; }
    .history-item:hover { background: var(--bg-hover); }

    .h-type {
      font-size: 9px;
      font-weight: 700;
      font-family: var(--mono);
      padding: 2px 5px;
      border-radius: 4px;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }

    .h-type.tor { background: rgba(91,204,122,0.12); color: var(--green); }
    .h-type.http { background: var(--accent-glow); color: var(--accent); }

    .h-info { flex: 1; min-width: 0; }

    .h-name {
      font-size: 11.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .h-time {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--text-muted);
      margin-top: 1px;
    }

    .h-resend {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: background 120ms, color 120ms;
      opacity: 0;
    }

    .history-item:hover .h-resend { opacity: 1; }
    .h-resend:hover { background: var(--bg-card); color: var(--accent); }
    .h-resend svg { width: 12px; height: 12px; }

    /* ── Magnets on page ── */
    .magnet-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-sub);
      cursor: pointer;
      transition: background 120ms;
    }

    .magnet-item:last-child { border-bottom: none; }
    .magnet-item:hover { background: var(--bg-hover); }

    .magnet-icon {
      width: 26px;
      height: 26px;
      background: rgba(91,204,122,0.10);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .magnet-icon svg { width: 13px; height: 13px; color: var(--green); }

    .magnet-label {
      font-size: 11.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .magnet-send {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-glow);
      border: none;
      border-radius: 5px;
      padding: 3px 8px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 120ms;
    }

    .magnet-send:hover { background: rgba(91,94,244,0.25); }

    /* ── Empty state ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      gap: 6px;
      color: var(--text-muted);
    }

    .empty svg { width: 28px; height: 28px; opacity: 0.4; }
    .empty p   { font-size: 12px; }
    .empty span { font-size: 10.5px; opacity: 0.7; }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-top: 1px solid var(--border-sub);
      background: var(--bg-panel);
    }

    .footer-link {
      font-size: 10.5px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 120ms;
    }

    .footer-link:hover { color: var(--text-sec); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 14px;
      font-size: 11.5px;
      color: var(--text);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      white-space: nowrap;
      z-index: 100;
      animation: toastIn 160ms ease;
    }

    @keyframes toastIn {
      from { opacity:0; transform: translateX(-50%) translateY(6px); }
      to   { opacity:1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Util ── */
    .hidden { display: none !important; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .text-green { color: var(--green); }
    .text-red   { color: var(--red); }
  </style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <div class="logo" style="background:#5B5EF4;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0">Z</div>
  <div>
    <div class="header-title">Zest Downloader</div>
    <div class="header-sub" id="header-sub">Loading…</div>
  </div>
  <label class="toggle" title="Enable / disable interception">
    <input type="checkbox" id="enable-toggle" checked />
    <div class="toggle-track"></div>
  </label>
</div>

<!-- ── Status bar ── -->
<div class="status-bar">
  <div class="status-dot" id="status-dot"></div>
  <span class="status-text" id="status-text">Checking connection…</span>
  <span class="capture-count" id="capture-count"></span>
</div>

<!-- ── Add URL ── -->
<div class="section">
  <div class="section-label">Add URL or magnet</div>
  <div class="input-row">
    <input
      class="url-input"
      id="url-input"
      type="text"
      placeholder="https://… or magnet:?xt=…"
      spellcheck="false"
    />
    <button class="btn btn-primary" id="add-btn" disabled>Send</button>
  </div>
</div>

<!-- ── Tabs ── -->
<div class="tabs">
  <button class="tab active" id="tab-btn-history" data-tab="history">Recent</button>
  <button class="tab"        id="tab-btn-magnets" data-tab="magnets">On this page</button>
</div>

<!-- ── History panel ── -->
<div class="tab-panel active" id="panel-history">
  <div class="history-wrap" id="history-list">
    <div class="empty" id="history-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <p>No captures yet</p>
      <span>Downloads will appear here</span>
    </div>
  </div>
</div>

<!-- ── Magnets panel ── -->
<div class="tab-panel" id="panel-magnets">
  <div id="magnets-list">
    <div class="empty" id="magnets-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M8.5 8.5a5 5 0 1 0 7 7"/>
        <path d="M4.5 4.5a10 10 0 1 0 15 15"/>
      </svg>
      <p>No magnets on this page</p>
      <span>Visit a torrent site to see links</span>
    </div>
  </div>
</div>

<!-- ── Footer ── -->
<div class="footer">
  <button class="footer-link" id="clear-history-btn">Clear history</button>
  <button class="footer-link" id="open-settings-btn">Settings ↗</button>
</div>

<script src="popup.js"></script>

</body>
</html>
